# Schema Definition
_schema:
  description: "Catálogo dos melhores momentos das calls auditadas, com fase, impacto no score e framework utilizado"
  fields:
    moment_id:
      type: string
      required: true
      description: "Identificador único do momento (ex: MOM-001)"
    call_id:
      type: string
      required: true
      description: "ID da call onde o momento ocorreu (referência ao calls-registry)"
    phase:
      type: string
      required: true
      description: "Fase da call onde o momento ocorreu (rapport, discovery, pitch, close)"
    description:
      type: string
      required: true
      description: "Descrição detalhada do que aconteceu no momento"
    score_impact:
      type: number
      required: false
      description: "Impacto estimado no score da call (pontos positivos)"
    framework:
      type: string
      required: false
      description: "Framework utilizado no momento, se aplicável"
  updated_by: "extract-win-patterns"
  update_frequency: "monthly"
  owner: "win-loss-miner"
  cross_references:
    - "data/registries/calls-registry.yaml"
    - "data/registries/win-patterns-registry.yaml"
    - "data/registries/scorecards-registry.yaml"

# ---
# Registro de Melhores Momentos
# Momentos de destaque identificados nas calls auditadas
# Última atualização: Pendente

metadata:
  name: "best-moments-registry"
  description: "Catálogo dos melhores momentos das calls, com fase, descrição, impacto no score e framework utilizado."
  updated: "YYYY-MM-DD"
  version: "1.0.0"

schema:
  fields:
    - name: moment_id
      type: string
      description: "Identificador único do momento (ex: MOM-001)"
      required: true
    - name: call_id
      type: string
      description: "ID da call onde o momento ocorreu (referência ao calls-registry)"
      required: true
    - name: phase
      type: string
      description: "Fase da call onde o momento ocorreu (rapport, discovery, pitch, close)"
      required: true
    - name: description
      type: string
      description: "Descrição detalhada do que aconteceu no momento"
      required: true
    - name: score_impact
      type: number
      description: "Impacto estimado no score da call (pontos positivos)"
      required: false
    - name: framework
      type: string
      description: "Framework utilizado no momento, se aplicável"
      required: false

entries: []
# Entries will be added as calls are audited
# Example entry format:
# - moment_id: "MOM-001"
#   call_id: "CALL-003"
#   phase: "discovery"

# Schema Definition
_schema:
  description: "Registro central de metadados de todas as calls de vendas ingeridas e auditadas pelo squad"
  fields:
    id:
      type: string
      required: true
      description: "Identificador único da call (ex: CALL-001)"
    date:
      type: date
      required: true
      description: "Data em que a call foi realizada"
    closer:
      type: string
      required: true
      description: "Nome ou ID do closer que conduziu a call"
    lead:
      type: string
      required: true
      description: "Nome ou identificação do lead"
    offer:
      type: string
      required: true
      description: "Oferta ou produto apresentado na call"
    source:
      type: string
      required: false
      description: "Origem do lead (tráfego pago, orgânico, indicação, etc.)"
    duration:
      type: number
      required: true
      description: "Duração da call em minutos"
    outcome:
      type: string
      required: true
      description: "Resultado da call (fechou, não fechou, follow-up, no-show)"
    score:
      type: number
      required: false
      description: "Score total da auditoria (0-100)"
    audited:
      type: string
      required: true
      description: "Status da auditoria (sim, não, pendente)"
  updated_by: "intake-call-recording"
  update_frequency: "per-call"
  owner: "transcript-analyst"
  cross_references:
    - "data/registries/scorecards-registry.yaml"
    - "data/registries/closers-registry.yaml"
    - "data/transcripts/cleaned"

# ---
# Registro de Calls
# Registro central de todas as calls de vendas auditadas
# Última atualização: Pendente

metadata:
  name: "calls-registry"
  description: "Registro central de todas as calls de vendas, incluindo dados do closer, lead, oferta, resultado e score da auditoria."
  updated: "YYYY-MM-DD"
  version: "1.0.0"

schema:
  fields:
    - name: id
      type: string
      description: "Identificador único da call (ex: CALL-001)"
      required: true
    - name: date
      type: date
      description: "Data em que a call foi realizada"
      required: true
    - name: closer
      type: string
      description: "Nome ou ID do closer que conduziu a call"
      required: true
    - name: lead
      type: string
      description: "Nome ou identificação do lead"
      required: true
    - name: offer
      type: string
      description: "Oferta ou produto apresentado na call"
      required: true
    - name: source
      type: string
      description: "Origem do lead (tráfego pago, orgânico, indicação, etc.)"
      required: false
    - name: duration
      type: number
      description: "Duração da call em minutos"
      required: true
    - name: outcome
      type: string
      description: "Resultado da call (fechou, não fechou, follow-up, no-show)"
      required: true
    - name: score
      type: number
      description: "Score total da auditoria (0-100)"
      required: false
    - name: audited
      type: string
      description: "Status da auditoria (sim, não, pendente)"
      required: true

entries: []
# Entries will be added as calls are audited
# Example entry format:
# - id: "CALL-001"
#   date: "2026-03-20"
#   closer: "João Silva"
#   lead: "Maria Oliveira"
#   offer: "Mentoria Premium"
#   source: "tráfego pago"
#   duration: 45
#   outcome: "fechou"
#   score: 85
#   audited: "sim"

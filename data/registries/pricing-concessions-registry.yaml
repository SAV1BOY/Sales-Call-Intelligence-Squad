# Schema Definition
_schema:
  description: "Registro de concessões de preço feitas durante as calls, com preço original, final, tipo de concessão e justificativa"
  fields:
    call_id:
      type: string
      required: true
      description: "ID da call auditada (referência ao calls-registry)"
    original_price:
      type: number
      required: true
      description: "Preço original da oferta apresentado"
    final_price:
      type: number
      required: true
      description: "Preço final após concessão"
    concession_type:
      type: string
      required: true
      description: "Tipo de concessão (desconto, parcelamento, bônus, prazo estendido)"
    justified:
      type: string
      required: true
      description: "Se a concessão foi justificada estrategicamente (sim, não, parcialmente)"
  updated_by: "analyze-pricing"
  update_frequency: "per-call"
  owner: "pricing-anchoring-analyst"
  cross_references:
    - "data/registries/calls-registry.yaml"
    - "data/registries/deal-risk-registry.yaml"
    - "data/registries/scorecards-registry.yaml"

# ---
# Registro de Concessões de Preço
# Rastreamento de descontos e concessões oferecidos durante as calls
# Última atualização: Pendente

metadata:
  name: "pricing-concessions-registry"
  description: "Registro de concessões de preço feitas durante as calls, incluindo preço original, final, tipo de concessão e justificativa."
  updated: "YYYY-MM-DD"
  version: "1.0.0"

schema:
  fields:
    - name: call_id
      type: string
      description: "ID da call auditada (referência ao calls-registry)"
      required: true
    - name: original_price
      type: number
      description: "Preço original da oferta apresentado"
      required: true
    - name: final_price
      type: number
      description: "Preço final após concessão"
      required: true
    - name: concession_type
      type: string
      description: "Tipo de concessão (desconto, parcelamento, bônus, prazo estendido)"
      required: true
    - name: justified
      type: string
      description: "Se a concessão foi justificada estrategicamente (sim, não, parcialmente)"
      required: true

entries: []
# Entries will be added as calls are audited
# Example entry format:
# - call_id: "CALL-001"
#   original_price: 5000
#   final_price: 4200
#   concession_type: "desconto"
#   justified: "sim"

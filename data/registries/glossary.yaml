# Schema Definition
_schema:
  description: "Glossário de termos técnicos e jargões utilizados na auditoria de calls de vendas do squad"
  fields:
    term:
      type: string
      required: true
      description: "Termo ou expressão a ser definido"
    definition:
      type: string
      required: true
      description: "Definição clara e objetiva do termo"
    context:
      type: string
      required: false
      description: "Contexto de uso do termo no processo de vendas"
    related_terms:
      type: list
      required: false
      description: "Termos relacionados para referência cruzada"
  updated_by: "cross-squad-intelligence-sync"
  update_frequency: "weekly"
  owner: "sales-chief"
  cross_references:
    - "data/registries/framework-detection-registry.yaml"
    - "data/registries/objections-registry.yaml"

# ---
# Glossário
# Definições de termos utilizados no sistema de auditoria de calls
# Última atualização: Pendente

metadata:
  name: "glossary"
  description: "Glossário de termos técnicos e jargões utilizados na auditoria de calls de vendas."
  updated: "YYYY-MM-DD"
  version: "1.0.0"

schema:
  fields:
    - name: term
      type: string
      description: "Termo ou expressão a ser definido"
      required: true
    - name: definition
      type: string
      description: "Definição clara e objetiva do termo"
      required: true
    - name: context
      type: string
      description: "Contexto de uso do termo no processo de vendas"
      required: false
    - name: related_terms
      type: array
      description: "Termos relacionados para referência cruzada"
      required: false

entries: []
# Entries will be added as terms are identified
# Example entry format:
# - term: "Framework"
#   definition: "Estrutura metodológica utilizada pelo closer para conduzir uma etapa da call"
#   context: "Usado na auditoria para avaliar se o closer seguiu metodologias comprovadas"
#   related_terms: ["SPIN Selling", "Scorecard", "Bloco de avaliação"]

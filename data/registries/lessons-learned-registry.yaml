# Schema Definition
_schema:
  description: "Registro de lições aprendidas extraídas das auditorias, coaching e revisões, com categoria e ações tomadas"
  fields:
    lesson_id:
      type: string
      required: true
      description: "Identificador único da lição (ex: LES-001)"
    call_id:
      type: string
      required: true
      description: "ID da call de origem (referência ao calls-registry)"
    description:
      type: string
      required: true
      description: "Descrição detalhada da lição aprendida"
    category:
      type: string
      required: true
      description: "Categoria da lição (técnica, comportamental, processual, estratégica)"
    action_taken:
      type: string
      required: false
      description: "Ação tomada ou recomendada com base na lição"
  updated_by: "rewrite-critical-moments, build-coaching-pack, weekly-sales-quality-review, cross-squad-intelligence-sync"
  update_frequency: "per-call"
  owner: "closer-trainer"
  cross_references:
    - "data/registries/calls-registry.yaml"
    - "data/registries/scorecards-registry.yaml"
    - "data/registries/closers-registry.yaml"

# ---
# Registro de Lições Aprendidas
# Lições extraídas das auditorias de calls
# Última atualização: Pendente

metadata:
  name: "lessons-learned-registry"
  description: "Registro de lições aprendidas em cada auditoria, categorizadas e com ações tomadas."
  updated: "YYYY-MM-DD"
  version: "1.0.0"

schema:
  fields:
    - name: lesson_id
      type: string
      description: "Identificador único da lição (ex: LES-001)"
      required: true
    - name: call_id
      type: string
      description: "ID da call de origem (referência ao calls-registry)"
      required: true
    - name: description
      type: string
      description: "Descrição detalhada da lição aprendida"
      required: true
    - name: category
      type: string
      description: "Categoria da lição (técnica, comportamental, processual, estratégica)"
      required: true
    - name: action_taken
      type: string
      description: "Ação tomada ou recomendada com base na lição"
      required: false

entries: []
# Entries will be added as calls are audited

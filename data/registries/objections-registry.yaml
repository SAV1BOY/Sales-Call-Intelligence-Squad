# Schema Definition
_schema:
  description: "Biblioteca de objeções catalogadas nas calls de vendas, com tipo, causa raiz, frequência e melhor resposta"
  fields:
    id:
      type: string
      required: true
      description: "Identificador único da objeção (ex: OBJ-001)"
    type:
      type: string
      required: true
      description: "Tipo da objeção (money, timing, authority, trust, competitor, inertia)"
    real_cause:
      type: string
      required: false
      description: "Causa real por trás da objeção identificada na auditoria"
    frequency:
      type: number
      required: true
      description: "Número de vezes que a objeção foi registrada"
    best_response:
      type: string
      required: false
      description: "Melhor resposta ou abordagem para contornar a objeção"
    framework:
      type: string
      required: false
      description: "Framework recomendado para tratamento da objeção"
  updated_by: "analyze-objections, update-objections-library"
  update_frequency: "per-call"
  owner: "objection-specialist"
  cross_references:
    - "data/registries/calls-registry.yaml"
    - "data/registries/deal-risk-registry.yaml"
    - "data/registries/loss-patterns-registry.yaml"

# ---
# Registro de Objeções
# Catalogação de objeções identificadas nas calls de vendas
# Última atualização: Pendente

metadata:
  name: "objections-registry"
  description: "Registro de objeções encontradas nas calls, classificadas por tipo, causa real, frequência e melhor resposta."
  updated: "YYYY-MM-DD"
  version: "1.0.0"

schema:
  fields:
    - name: id
      type: string
      description: "Identificador único da objeção (ex: OBJ-001)"
      required: true
    - name: type
      type: string
      description: "Tipo da objeção (money, time, spouse, trust)"
      required: true
    - name: real_cause
      type: string
      description: "Causa real por trás da objeção identificada na auditoria"
      required: false
    - name: frequency
      type: number
      description: "Número de vezes que a objeção foi registrada"
      required: true
    - name: best_response
      type: string
      description: "Melhor resposta ou abordagem para contornar a objeção"
      required: false
    - name: framework
      type: string
      description: "Framework recomendado para tratamento da objeção"
      required: false

entries: []
# Entries will be added as calls are audited
# Example entry format:
# - id: "OBJ-001"
#   type: "money"
#   real_cause: "Lead não percebeu valor suficiente na oferta"
#   frequency: 15
#   best_response: "Revisitar dor e custo da inação antes de apresentar preço"
#   framework: "Isolamento de objeção + ancoragem de valor"

# Schema Definition
_schema:
  description: "Registro de frameworks de vendas detectados e ausentes em cada call auditada, com evidências e fase"
  fields:
    call_id:
      type: string
      required: true
      description: "ID da call auditada (referência ao calls-registry)"
    frameworks_detected:
      type: list
      required: true
      description: "Lista de frameworks identificados na call"
    frameworks_missing:
      type: list
      required: true
      description: "Lista de frameworks que deveriam ter sido usados mas não foram"
    evidence:
      type: string
      required: false
      description: "Evidência textual ou timestamp que comprova a detecção ou ausência"
    phase:
      type: string
      required: true
      description: "Fase da call onde o framework foi detectado ou deveria ter sido usado"
  updated_by: "full-call-audit, framework-detection"
  update_frequency: "per-call"
  owner: "framework-detector"
  cross_references:
    - "data/registries/calls-registry.yaml"
    - "data/registries/scorecards-registry.yaml"
    - "data/registries/win-patterns-registry.yaml"

# ---
# Registro de Detecção de Frameworks
# Rastreamento de frameworks utilizados e ausentes em cada call auditada
# Última atualização: Pendente

metadata:
  name: "framework-detection-registry"
  description: "Registro de quais frameworks foram detectados e quais estavam ausentes em cada call, com evidências e fase da call."
  updated: "YYYY-MM-DD"
  version: "1.0.0"

schema:
  fields:
    - name: call_id
      type: string
      description: "ID da call auditada (referência ao calls-registry)"
      required: true
    - name: frameworks_detected
      type: array
      description: "Lista de frameworks identificados na call"
      required: true
    - name: frameworks_missing
      type: array
      description: "Lista de frameworks que deveriam ter sido usados mas não foram"
      required: true
    - name: evidence
      type: string
      description: "Evidência textual ou timestamp que comprova a detecção ou ausência"
      required: false
    - name: phase
      type: string
      description: "Fase da call onde o framework foi detectado ou deveria ter sido usado (rapport, discovery, pitch, close)"
      required: true

entries: []
# Entries will be added as calls are audited
# Example entry format:
# - call_id: "CALL-001"
#   frameworks_detected: ["SPIN Selling", "Ancoragem de preço"]
#   frameworks_missing: ["Isolamento de objeção"]
#   evidence: "Aos 12:30 closer usou pergunta de implicação do SPIN"
#   phase: "discovery"

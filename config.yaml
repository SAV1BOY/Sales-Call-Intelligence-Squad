# ============================================================
# SALES CALL INTELLIGENCE SQUAD — config.yaml
# Cérebro de roteamento: tarefas → agentes, frameworks,
# checklists, templates, registries
# ============================================================

squad:
  name: sales-call-intelligence
  version: "2.0.0"
  description: "Auditoria de calls high ticket, coaching, score, win/loss mining e melhoria contínua"
  chief_agent: sales-chief

principles:
  - phase_first                      # Cada framework entra na fase correta
  - evidence_over_opinion            # Toda crítica com trecho, minuto e evidência
  - score_before_advice              # Primeiro pontua, depois aconselha
  - rewrite_the_moment               # Sempre reescreve a fala ideal
  - objection_is_a_symptom           # Objeção é efeito, não causa
  - post_call_learning_mandatory     # Toda call ensina algo ao sistema
  - closer_performance_is_systemic   # Problema pode estar no lead, oferta, pitch, SDR ou pricing

# ============================================================
# ROUTING — Tarefas → Agentes + Frameworks + Checklists
# ============================================================

routing:

  # ---- INGESTÃO ----
  intake-call-recording:
    agents: [transcript-analyst, call-auditor]
    frameworks: [sales-call-stage-taxonomy]
    checklists: [transcript-normalization-quality]
    templates: [briefs/call-audit-brief]
    registry: [data/registries/calls-registry]

  normalize-and-segment:
    agents: [transcript-analyst]
    frameworks: [minute-by-minute-analysis-framework, sales-call-stage-taxonomy]
    checklists: [transcript-normalization-quality, minute-by-minute-analysis-quality]
    templates: [reports/minute-by-minute-audit-report]
    registry: [data/transcripts/cleaned, data/transcripts/segmented]

  # ---- AUDITORIA COMPLETA ----
  full-call-audit:
    agents: [call-auditor, framework-detector, scorecard-analyst, objection-specialist, pricing-anchoring-analyst, talk-ratio-analyst]
    frameworks: [minute-by-minute-analysis-framework, call-scoring-model, evelyn-system-digital-framework]
    checklists: [call-audit-quality, minute-by-minute-analysis-quality, framework-detection-quality, call-scorecard-quality, root-cause-analysis-quality]
    templates: [reports/full-call-audit-report, scorecards/call-scorecard-template]
    registry: [data/registries/scorecards-registry, data/registries/framework-detection-registry]

  framework-detection:
    agents: [framework-detector, alex-hormozi, jeremy-miner, jordan-belfort, cole-gordon, neil-rackham, matthew-dixon]
    frameworks: [spin-selling, nepq, straight-line-persuasion, closer-four-part-framework, value-equation, challenger-sale]
    checklists: [framework-detection-quality, spin/spin-sequence-check, miner/miner-consequence-questions-check, belfort/belfort-straight-line-check, cole-gordon/cole-frame-check]
    templates: [reports/framework-detection-report]
    registry: [data/registries/framework-detection-registry]

  # ---- POR FASE DA CALL ----
  analyze-rapport-and-frame:
    agents: [call-auditor, cole-gordon, dan-lok]
    frameworks: [first-pact-three-intentions, doctor-frame, cole-gordon/cole-frame-setting-system]
    checklists: [rapport/warm-up-quality, rapport/first-pact-quality, cole-gordon/cole-frame-check, dan-lok/dan-doctor-frame-check]
    templates: [reports/full-call-audit-report]
    registry: [data/registries/scorecards-registry]

  analyze-discovery:
    agents: [call-auditor, neil-rackham, jeremy-miner, cole-gordon]
    frameworks: [spin-selling, nepq, consequence-questioning, miner/miner-nepq-deep-dive, cole-gordon/cole-deep-diagnosis-method]
    checklists: [discovery/spin-situation-quality, discovery/spin-problem-quality, discovery/spin-implication-quality, discovery/spin-need-payoff-quality, discovery/nepq-consequence-questions-quality, discovery/qualification-depth-quality, discovery/diagnosis-depth-quality]
    templates: [reports/full-call-audit-report]
    registry: [data/registries/scorecards-registry, data/registries/deal-risk-registry]

  analyze-pitch:
    agents: [call-auditor, cole-gordon, alex-hormozi, sabri-suby]
    frameworks: [second-pact-sim-ou-nao, diagnosis-to-offer-mapping, value-equation, value-stacking, hormozi/hormozi-grand-slam-offer, sabri-suby/suby-godfather-offer-build]
    checklists: [pitch/second-pact-quality, pitch/company-presentation-quality, pitch/method-presentation-quality, pitch/product-presentation-quality, pitch/pitch-uses-lead-language-quality, pitch/social-proof-quality]
    templates: [reports/full-call-audit-report]
    registry: [data/registries/scorecards-registry]

  analyze-pricing:
    agents: [pricing-anchoring-analyst, alex-hormozi, sabri-suby]
    frameworks: [price-anchoring, value-equation, risk-reversal, value-stacking, hormozi/hormozi-price-to-value-gap, sabri-suby/suby-risk-reversal-system]
    checklists: [pricing/value-stack-quality, pricing/price-anchoring-quality, pricing/risk-reversal-quality, pricing/concession-control-quality, pricing-analysis-quality]
    templates: [reports/pricing-analysis-report]
    registry: [data/registries/pricing-concessions-registry]

  analyze-objections:
    agents: [objection-specialist, jordan-belfort, bradley-lea, eli-wilde]
    frameworks: [objection-isolation, objection-looping, belief-shift, belfort/belfort-looping-system, eli-wilde/wilde-belief-shift-protocol, bradley-lea/lea-preventive-objection-system]
    checklists: [objections/objection-isolation-quality, objections/money-objection-quality, objections/looping-quality, objections/belief-shift-quality, objections/preventive-objection-handling-quality, bradley/bradley-universal-objections-check]
    templates: [reports/objection-analysis-report, rewrites/objection-rewrite-template]
    registry: [data/registries/objections-registry, data/registries/deal-risk-registry]

  analyze-closing:
    agents: [call-auditor, jordan-belfort, cole-gordon]
    frameworks: [straight-line-persuasion, no-maybe-closing-system, certainty-triad, belfort/belfort-straight-line-deep-dive]
    checklists: [closing/decision-commitment-quality, closing/assumptive-close-quality, closing/next-step-lock-quality, closing/no-maybe-zone-quality]
    templates: [reports/full-call-audit-report]
    registry: [data/registries/scorecards-registry]

  analyze-talk-ratio:
    agents: [talk-ratio-analyst, call-auditor]
    frameworks: [talk-ratio-analysis-framework]
    checklists: [talk-ratio-analysis-quality]
    templates: [reports/full-call-audit-report]
    registry: [data/registries/scorecards-registry]

  analyze-sdr-handoff:
    agents: [sdr-handoff-analyst, call-auditor]
    frameworks: [sales-call-stage-taxonomy]
    checklists: [handoff-quality]
    templates: [reports/sdr-handoff-audit-report]
    registry: [data/registries/handoff-registry]

  # ---- COACHING ----
  rewrite-critical-moments:
    agents: [coaching-rewriter, closer-trainer, objection-specialist]
    frameworks: [rewrite-the-moment-framework, diagnosis-to-offer-mapping]
    checklists: [rewrite-quality, coaching-plan-quality]
    templates: [rewrites/objection-rewrite-template, rewrites/pitch-rewrite-template, rewrites/closing-rewrite-template, rewrites/discovery-rewrite-template]
    registry: [data/rewrites, data/registries/lessons-learned-registry]

  build-coaching-pack:
    agents: [closer-trainer, scorecard-analyst, sales-chief]
    frameworks: [call-scoring-model, post-call-learning-loop]
    checklists: [manager-review-quality, coaching-plan-quality]
    templates: [reports/manager-coaching-report, scorecards/closer-performance-scorecard]
    registry: [data/registries/lessons-learned-registry]

  certify-closer:
    agents: [closer-trainer, qa-guardian, sales-chief]
    frameworks: [call-scoring-model]
    checklists: [rep-certification-quality]
    templates: [scorecards/certification-scorecard, reports/closer-certification-report]
    registry: [data/registries/closers-registry]

  # ---- INTELLIGENCE ----
  extract-win-patterns:
    agents: [win-loss-miner, revenue-intelligence-analyst, framework-detector]
    frameworks: [win-loss-pattern-mining, call-scoring-model]
    checklists: [win-loss-analysis-quality, best-moments-library-quality]
    templates: [reports/win-loss-analysis-report]
    registry: [data/registries/win-patterns-registry]

  extract-loss-patterns:
    agents: [win-loss-miner, deal-risk-doctor, sdr-handoff-analyst, offer-fit-analyst]
    frameworks: [deal-risk-diagnosis, win-loss-pattern-mining, promise-vs-proof-framework]
    checklists: [win-loss-analysis-quality, handoff-quality, promise-sanity-check-quality]
    templates: [reports/win-loss-analysis-report]
    registry: [data/registries/loss-patterns-registry, data/registries/deal-risk-registry]

  analyze-offer-fit:
    agents: [offer-fit-analyst, revenue-intelligence-analyst]
    frameworks: [diagnosis-to-offer-mapping, value-equation]
    checklists: [qualification-analysis-quality, promise-sanity-check-quality]
    templates: [reports/executive-sales-intelligence-report]
    registry: [data/registries/deal-risk-registry]

  # ---- REVIEW ----
  weekly-sales-quality-review:
    agents: [sales-chief, scorecard-analyst, closer-trainer]
    frameworks: [post-call-learning-loop, call-scoring-model]
    checklists: [manager-review-quality]
    templates: [reports/executive-sales-intelligence-report]
    registry: [data/registries/lessons-learned-registry]

  monthly-closer-certification:
    agents: [sales-chief, closer-trainer, qa-guardian]
    frameworks: [call-scoring-model]
    checklists: [rep-certification-quality]
    templates: [scorecards/closer-performance-scorecard, reports/closer-certification-report]
    registry: [data/registries/closers-registry]

  # ---- OPERATIONS ----
  cross-squad-intelligence-sync:
    agents: [sales-chief, revenue-intelligence-analyst]
    frameworks: []
    checklists: [cross-squad/cross-squad-copy-handoff-quality, cross-squad/cross-squad-traffic-handoff-quality, cross-squad/cross-squad-offer-handoff-quality, cross-squad/cross-squad-ops-handoff-quality]
    templates: [operational/cross-squad-handoff-template]
    registry: [data/registries/lessons-learned-registry]

  update-objections-library:
    agents: [objection-specialist, win-loss-miner]
    frameworks: [high-ticket-objection-taxonomy]
    checklists: [objections-library-update-quality]
    templates: []
    registry: [data/registries/objections-registry]

  calibrate-scoring:
    agents: [qa-guardian, scorecard-analyst, sales-chief]
    frameworks: [call-scoring-model]
    checklists: [qa/qa-score-calibration-check]
    templates: [scorecards/call-scorecard-template]
    registry: [data/registries/scorecards-registry]

# ============================================================
# CROSS-SQUAD INTEGRATION (bidirecional)
# ============================================================

cross_squad:
  copy_squad:
    handoff_to_copy:
      - "objeções reais do mercado → copy/data/research"
      - "frases do lead sobre dor → copy/swipe"
      - "palavras que ativam interesse → copy/phrases"
    handoff_from_copy:
      - "novas variações de pitch → data/research"
      - "respostas de objeção mais fortes → data/objections"
    shared_assets: [objection-library, pitch-language-bank, value-proposition-bank]

  traffic_squad:
    handoff_to_traffic:
      - "qualidade do lead por origem → traffic/data/metrics"
      - "promessas que geram lead ruim → traffic/reference"
      - "ângulos desalinhados → traffic/data/research"
    handoff_from_traffic:
      - "canal/origem/campanha → data/research"
      - "CPL/CPA vs close rate → data/metrics"
    shared_assets: [lead-source-quality, campaign-message-fit]

  brand_squad:
    handoff_to_brand:
      - "percepção de marca na call → brand/data/research"
      - "confiança/desconfiança → brand/reference"
    handoff_from_brand:
      - "posicionamento atualizado → data/research"
      - "provas sociais → reference/sales"
    shared_assets: [brand-perception, authority-assets]

  storytelling_squad:
    handoff_to_storytelling:
      - "cases de sucesso → storytelling/reference"
      - "frases de conexão → storytelling/swipe"
    handoff_from_storytelling:
      - "narrativas de case → reference/case-studies"
    shared_assets: [case-narratives, proof-points]

  c_level_squad:
    handoff_to_c_level:
      - "objeções de pricing → c-level/data/memos"
      - "mismatch oferta × mercado → c-level/tasks"
    handoff_from_c_level:
      - "mudanças de pricing → data/registries/pricing-concessions-registry"
      - "novos stacks/garantias → reference/sales"
    shared_assets: [pricing-registry, offer-fit-analysis]

  data_squad:
    handoff_to_data:
      - "scorecards → data/tasks"
      - "close rates → data/registries"
    handoff_from_data:
      - "cohort analysis → data/research"
      - "closer benchmarking → data/metrics"
    shared_assets: [closer-performance-dashboard, score-vs-close-rate]

  movement_squad:
    handoff_to_movement:
      - "linguagem do lead → movement/data/research"
    handoff_from_movement:
      - "cultural insights → reference/psychology"
    shared_assets: [market-language, cultural-signals]

  advisory_board:
    handoff_to_advisory:
      - "pricing strategy questions → advisory/tasks"
      - "offer fit analysis → advisory/data"
    handoff_from_advisory:
      - "strategic guidance → data/registries/lessons-learned-registry"
    shared_assets: [strategic-pricing-decisions]

# ============================================================
# QUALITY GATES
# ============================================================

quality_gates:
  mandatory:
    - call-audit-quality              # Toda auditoria com evidência
    - call-scorecard-quality          # Score calculado e justificado
    - root-cause-analysis-quality     # Causa raiz identificada
    - rewrite-quality                 # Momentos críticos reescritos
  per_domain:
    rapport: [rapport/first-pact-quality, rapport/first-impression-authority-quality]
    discovery: [discovery/spin-implication-quality, discovery/diagnosis-depth-quality]
    pitch: [pitch/second-pact-quality, pitch/pitch-uses-lead-language-quality]
    pricing: [pricing/price-anchoring-quality, pricing/value-stack-quality]
    objections: [objections/objection-isolation-quality, objections/preventive-objection-handling-quality]
    closing: [closing/decision-commitment-quality, closing/next-step-lock-quality]
    coaching: [coaching-plan-quality, manager-review-quality]
    intelligence: [win-loss-analysis-quality, best-moments-library-quality]
    qa: [qa/qa-methodology-consistency-check, qa/qa-score-calibration-check]

# ============================================================
# KPIs
# ============================================================

kpis:
  call_quality:
    - average_call_score                # Score médio das calls
    - score_improvement_rate            # Melhoria do score ao longo do tempo
    - framework_usage_rate              # % de calls com frameworks detectados
    - talk_ratio_average                # Talk ratio médio (ideal: 30/70)
    - discovery_depth_score             # Profundidade média de discovery
  revenue_impact:
    - close_rate_by_closer              # Taxa de fechamento por closer
    - close_rate_by_offer               # Taxa por oferta
    - close_rate_by_lead_source         # Taxa por origem
    - revenue_per_call                  # Receita por call
    - price_concession_rate             # Taxa de concessão de preço
  coaching:
    - coaching_impact_score             # Impacto do coaching no score
    - rewrite_adoption_rate             # % de rewrites implementados pelo closer
    - certification_pass_rate           # Taxa de aprovação na certificação
    - time_to_competence                # Tempo para closer atingir score mínimo
  operational:
    - audit_cycle_time                  # Tempo de call → auditoria completa
    - objection_library_currency        # Biblioteca de objeções atualizada
    - win_pattern_registry_currency     # Registro de padrões atualizado
    - cross_squad_delivery_rate         # Taxa de entrega de insights

# ============================================================
# SCORECARD MESTRE
# ============================================================

scorecard:
  blocks:
    rapport_abertura: 8
    primeiro_pacto_frame: 8
    diagnostico_spin_profundidade: 18
    ampliacao_dor_implicacao: 8
    segundo_pacto: 5
    empresa_metodo_produto: 12
    pitch_amarrado_fala_lead: 9
    ancoragem_preco: 10
    objecoes: 12
    fechamento_proximos_passos: 10
  total: 100
  output_obrigatorio:
    - score_total
    - score_por_bloco
    - tecnicas_detectadas
    - minuto_a_minuto
    - tres_maiores_acertos
    - tres_maiores_falhas
    - tres_falas_reescritas
    - causa_raiz
    - acao_proxima_call

# ============================================================
# DEFAULTS
# ============================================================

defaults:
  review_agent: sales-chief
  min_checklists: 2
  registry_on_completion: true
  output_format: markdown
  score_before_advice: true
  rewrite_mandatory: true
  evidence_with_timestamp: true
  cross_squad_sync: weekly
  certification_cadence: monthly
  qa_calibration_cadence: quarterly

# ============================================================
# ESCALATION RULES
# ============================================================

escalation_rules:
  low_confidence_score:
    trigger: "score_confidence < 0.7 OR dados insuficientes para pontuar bloco"
    action: "retornar ao call-auditor para reanálise com contexto adicional"
    escalate_to: sales-chief
    max_rework_cycles: 2

  conflicting_expert_advice:
    trigger: "2+ especialistas divergem na mesma fase da call"
    action: "qa-guardian arbitra usando evidência da transcrição; sales-chief aprova"
    escalate_to: qa-guardian
    final_authority: sales-chief

  out_of_scope:
    trigger: "task requer análise fora do domínio de vendas (ex: produto, financeiro, jurídico)"
    action: "documentar o que foi encontrado, criar handoff brief, delegar ao squad relevante"
    escalate_to: sales-chief
    handoff_template: templates/operational/cross-squad-handoff-template

  quality_gate_fail:
    trigger: "output falha em checklist obrigatório (quality_gates.mandatory)"
    action: "rework loop — retornar ao agente owner para correção"
    max_rework_cycles: 3
    final_escalation: sales-chief
    final_action: "sales-chief decide: aprovar com ressalvas OU reassignar OU escalar para HRM"

  audio_quality_issue:
    trigger: "transcrição < 80% audível ou speakers não identificáveis"
    action: "transcript-analyst marca trechos inaudíveis; call-auditor ajusta score com flag"
    escalate_to: transcript-analyst
    flag: "low_audio_confidence"

# ============================================================
# DELEGATION RULES
# ============================================================

delegation_rules:
  within_squad:
    transcript_issues: transcript-analyst
    framework_questions: framework-detector
    score_disputes: qa-guardian
    pricing_analysis: pricing-anchoring-analyst
    objection_classification: objection-specialist
    deal_risk_assessment: deal-risk-doctor
    win_loss_patterns: win-loss-miner
    sdr_handoff_issues: sdr-handoff-analyst
    offer_fit_questions: offer-fit-analyst

  cross_squad:
    copy_messaging: "copy_squad — quando objeção revela problema de messaging"
    traffic_lead_quality: "traffic_squad — quando lead source impacta close rate"
    offer_pricing_strategy: "c_level_squad — quando pricing precisa de decisão estratégica"
    data_analytics: "data_squad — quando análise requer cohort/pipeline data"
    brand_perception: "brand_squad — quando call revela problema de percepção de marca"
    storytelling_cases: "storytelling_squad — quando faltam cases para social proof"

# ============================================================
# REVIEW AGENTS
# ============================================================

review_agents:
  per_task_review: qa-guardian
  final_review: sales-chief
  cross_squad_review: sales-chief
  certification_review: [closer-trainer, qa-guardian, sales-chief]
  scoring_calibration: [qa-guardian, scorecard-analyst]
  rewrite_review: [coaching-rewriter, qa-guardian]

# ============================================================
# SCORE THRESHOLDS
# ============================================================

score_thresholds:
  call_quality:
    critical: 40              # Treinamento imediato obrigatório
    developing: 60            # Coaching semanal com foco nos 3 piores blocos
    good: 80                  # Refinamento tático
    excellent: 90             # Closer referência, material para swipe
    gold_standard: 95         # Padrão ouro — benchmark do squad
  operational:
    rework_trigger: 50        # Abaixo → rework obrigatório antes de publicar
    certification_min: 70     # Mínimo para certificação de closer
    audit_min_confidence: 0.7 # Confiança mínima no score
  checklist:
    pass_threshold: 0.8       # 80% dos items obrigatórios devem passar
    gold_threshold: 0.95      # 95% = nível GOLD

# ============================================================
# REWORK LOOPS
# ============================================================

rework_loops:
  audit_rework:
    trigger: "qa-guardian rejeita output de auditoria"
    return_to: "agente owner da etapa que falhou"
    max_cycles: 3
    escalation: "sales-chief decide: aprovar com notas OU reassignar OU escalar"
    registry: data/registries/lessons-learned-registry

  coaching_rework:
    trigger: "closer score < score_thresholds.call_quality.developing após ciclo de coaching"
    return_to: closer-trainer
    max_cycles: 2
    escalation: "sales-chief + c_level_squad para avaliar fit closer↔oferta"

  scoring_calibration_rework:
    trigger: "variância > 15% entre auditores no mesmo call"
    return_to: qa-guardian
    max_cycles: 1
    escalation: "sales-chief convoca calibration session"

# ============================================================
# CADENCE
# ============================================================

cadence:
  per_call:
    - intake-call-recording
    - normalize-and-segment
    - full-call-audit
    - framework-detection
    - rewrite-critical-moments
    - build-coaching-pack
  weekly:
    - weekly-sales-quality-review
    - cross-squad-intelligence-sync
    - update-objections-library
    - calibrate-scoring
  monthly:
    - monthly-closer-certification
    - extract-win-patterns
    - extract-loss-patterns
  quarterly:
    - analyze-offer-fit
    - certify-closer

# ============================================================
# TAXONOMY
# ============================================================

taxonomy:
  call_types:
    - discovery           # Primeira call — diagnóstico
    - follow_up           # Retorno — avançar negociação
    - closing             # Fechamento — decisão final
    - rescue              # Resgate — deal quase perdido
    - upsell              # Upgrade — cliente existente
    - renewal             # Renovação — retenção

  objection_types:
    - money               # "É caro", "não tenho orçamento"
    - timing              # "Preciso pensar", "agora não"
    - authority           # "Preciso falar com X"
    - trust               # "Não sei se funciona"
    - competitor          # "Já tentei algo parecido"
    - inertia             # "Estou bem como estou"

  deal_risk_levels:
    - low                 # Pipeline saudável, sem red flags
    - medium              # 1-2 red flags, monitorar
    - high                # 3+ red flags, intervenção necessária
    - critical            # Deal em risco iminente de perda

  closer_maturity:
    - junior              # Score médio < 60, < 6 meses
    - pleno               # Score 60-79, 6-18 meses
    - senior              # Score 80-89, 18+ meses
    - expert              # Score 90+, referência do time

  output_quality:
    - weak                # Falha em quality gates, rework obrigatório
    - fair                # Passa gates mínimos, mas sem profundidade
    - good                # Completo, evidenciado, acionável
    - gold                # Exemplar — material para swipe e treinamento
    - sota                # State of the art — benchmark do sistema

# ============================================================
# OUTPUT FORMATS
# ============================================================

output_formats:
  full_audit: templates/reports/full-call-audit-report
  scorecard: templates/scorecards/call-scorecard-template
  coaching_pack: templates/reports/manager-coaching-report
  framework_detection: templates/reports/framework-detection-report
  objection_analysis: templates/reports/objection-analysis-report
  pricing_analysis: templates/reports/pricing-analysis-report
  win_loss_report: templates/reports/win-loss-analysis-report
  executive_intelligence: templates/reports/executive-sales-intelligence-report
  minute_by_minute: templates/reports/minute-by-minute-audit-report
  sdr_handoff: templates/reports/sdr-handoff-audit-report
  certification: templates/reports/closer-certification-report
  rewrite_objection: templates/rewrites/objection-rewrite-template
  rewrite_pitch: templates/rewrites/pitch-rewrite-template
  rewrite_closing: templates/rewrites/closing-rewrite-template
  rewrite_discovery: templates/rewrites/discovery-rewrite-template
  cross_squad_handoff: templates/operational/cross-squad-handoff-template

# ============================================================
# APPROVAL MATRIX
# ============================================================

approval_matrix:
  full_audit:
    reviewer: qa-guardian
    approver: sales-chief
    escalation: "Se reviewer e approver divergem → calibration session"
  scorecard:
    reviewer: qa-guardian
    approver: sales-chief
    escalation: "Se variância > 15% → scoring_calibration_rework"
  coaching_pack:
    reviewer: qa-guardian
    approver: sales-chief
    escalation: "Se closer score < 40 → sales-chief + c_level_squad"
  rewrite:
    reviewer: coaching-rewriter
    approver: qa-guardian
    escalation: "Se framework contestado → specialist authority consultado"
  intelligence_report:
    reviewer: revenue-intelligence-analyst
    approver: sales-chief
    escalation: "Se dados insuficientes → adiar até sample size ≥ 10"
  cross_squad_handoff:
    approver: sales-chief
    quality_gate: "handoff brief completo + evidências"
    registry: data/handoffs/handoffs-registry
  certification:
    reviewer: [closer-trainer, qa-guardian]
    approver: sales-chief
    escalation: "Se closer falha 2x → plano de desenvolvimento intensivo"

# ============================================================
# TASK KPIs — Métricas de sucesso por task
# ============================================================

task_kpis:
  intake-call-recording:
    - metric: intake_completion_rate
      target: ">= 95%"
      measured_by: transcript-analyst
    - metric: avg_intake_time
      target: "< 30 min"
      measured_by: transcript-analyst

  full-call-audit:
    - metric: audit_accuracy
      target: ">= 90% inter-rater reliability"
      measured_by: qa-guardian
    - metric: audit_turnaround
      target: "< 24h após intake"
      measured_by: sales-chief

  framework-detection:
    - metric: detection_precision
      target: ">= 85% (validado por specialist)"
      measured_by: framework-detector
    - metric: false_positive_rate
      target: "< 10%"
      measured_by: qa-guardian

  score-call:
    - metric: scoring_consistency
      target: "variância < 15% entre auditores"
      measured_by: qa-guardian
    - metric: evidence_coverage
      target: "100% dos blocos com evidência"
      measured_by: scorecard-analyst

  rewrite-critical-moments:
    - metric: rewrite_quality_score
      target: ">= 3.5/5.0 no rubric"
      measured_by: qa-guardian
    - metric: score_improvement_potential
      target: ">= 10 pontos por rewrite"
      measured_by: coaching-rewriter

  build-coaching-pack:
    - metric: coaching_actionability
      target: "100% das prioridades com plano de ação"
      measured_by: closer-trainer
    - metric: closer_adoption_rate
      target: ">= 70% das recomendações implementadas"
      measured_by: closer-trainer

  weekly-sales-quality-review:
    - metric: review_coverage
      target: "100% das calls da semana revisadas"
      measured_by: sales-chief
    - metric: pattern_identification
      target: ">= 3 padrões por semana"
      measured_by: revenue-intelligence-analyst

  monthly-closer-certification:
    - metric: certification_pass_rate
      target: ">= 80% dos closers ativos"
      measured_by: closer-trainer
    - metric: score_progression
      target: ">= 5 pontos de melhoria mês-a-mês"
      measured_by: scorecard-analyst

  extract-win-patterns:
    - metric: pattern_statistical_significance
      target: "sample ≥ 10 calls por padrão"
      measured_by: win-loss-miner
    - metric: pattern_adoption_rate
      target: ">= 50% dos closers usando padrão em 30 dias"
      measured_by: closer-trainer

  cross-squad-intelligence-sync:
    - metric: handoff_completion_rate
      target: ">= 90% dos handoffs acknowledged em 72h"
      measured_by: sales-chief
    - metric: insight_actionability
      target: ">= 80% dos insights gerando ação no squad receptor"
      measured_by: sales-chief

# ============================================================
# CROSS-SQUAD CONTRACTS — Contratos formais de integração
# ============================================================

cross_squad_contracts:
  copy_squad:
    we_send:
      - "Objeções mais frequentes (top 10 semanal)"
      - "Linguagem exata do prospect (frases literais)"
      - "Dores verbalizadas com frequência"
    we_receive:
      - "Promessas feitas no copy/landing page"
      - "Ângulos de campanha ativos"
    format: templates/operational/cross-squad-handoff-template
    sla: "72h para acknowledgment"
    quality_gate: "handoff brief completo + evidências de 5+ calls"
    registry: data/handoffs/handoffs-registry

  traffic_squad:
    we_send:
      - "Qualidade dos leads por canal (score médio)"
      - "Taxa de no-show por origem"
      - "Tempo médio de call por fonte de tráfego"
    we_receive:
      - "Volume e origem dos leads (próximas 2 semanas)"
      - "Mudanças de campanha com antecedência"
    format: templates/operational/cross-squad-handoff-template
    sla: "1 semana"
    quality_gate: "dados de 10+ calls por canal"
    registry: data/handoffs/handoffs-registry

  brand_squad:
    we_send:
      - "Percepção de marca nas calls (como prospects descrevem)"
      - "Nível de awareness pré-call"
      - "Objeções de credibilidade"
    we_receive:
      - "Guidelines de posicionamento atualizados"
      - "Diferenciadores-chave para mencionar"
    format: templates/operational/cross-squad-handoff-template
    sla: "1 semana"
    quality_gate: "evidências de 5+ calls"
    registry: data/handoffs/handoffs-registry

  storytelling_squad:
    we_send:
      - "Momentos de conexão emocional que funcionaram"
      - "Cases que mais ressoaram com prospects"
      - "Narrativas de transformação eficazes"
    we_receive:
      - "Banco de histórias aprovadas"
      - "Estruturas narrativas para pitch"
    format: templates/operational/cross-squad-handoff-template
    sla: "1 semana"
    quality_gate: "3+ exemplos com evidência"
    registry: data/handoffs/handoffs-registry

  c_level_squad:
    we_send:
      - "Tendências de mercado detectadas nas calls"
      - "Análise de competidores mencionados"
      - "Dashboard executivo de performance"
    we_receive:
      - "Decisões de pricing/oferta"
      - "Mudanças estratégicas de modelo de vendas"
    format: templates/operational/cross-squad-handoff-template
    sla: "24h para critical, 72h para standard"
    quality_gate: "relatório executivo completo"
    registry: data/handoffs/handoffs-registry

  data_squad:
    we_send:
      - "Scorecards consolidados por closer/time"
      - "Close rates por segmento"
      - "Pedidos de análise cohort/pipeline"
    we_receive:
      - "Análises cohort com insights"
      - "Dashboards de pipeline"
    format: templates/operational/cross-squad-handoff-template
    sla: "1 semana"
    quality_gate: "dados estruturados + perguntas específicas"
    registry: data/handoffs/handoffs-registry

  movement_squad:
    we_send:
      - "Linguagem e valores do lead (cultural insights)"
      - "Objeções culturais/regionais"
    we_receive:
      - "Insights de comunidade e engajamento"
      - "Contexto cultural do público-alvo"
    format: templates/operational/cross-squad-handoff-template
    sla: "1 semana"
    quality_gate: "evidências de 5+ calls"
    registry: data/handoffs/handoffs-registry

  advisory_squad:
    we_send:
      - "Perguntas estratégicas sobre modelo de vendas"
      - "Conflitos metodológicos não resolvidos"
    we_receive:
      - "Orientação estratégica"
      - "Priorização de melhorias"
    format: templates/operational/cross-squad-handoff-template
    sla: "72h"
    quality_gate: "pergunta clara + contexto + tentativas anteriores"
    registry: data/handoffs/handoffs-registry
